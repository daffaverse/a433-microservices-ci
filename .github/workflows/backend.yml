name: Karsajobs CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Install Hadolint
        run: |
          sudo wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.10.0/hadolint-Linux-x86_64
          sudo chmod +x /bin/hadolint
      
      - name: Lint Dockerfile
        run: hadolint backend/Dockerfile
  
  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.15
      
      - name: Run tests
        working-directory: backend
        run: go test -v -short --count=1 $(go list ./...)
  
  build-app-karsajobs:
    needs: [lint-dockerfile, test-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PAT_GITHUB }}
      
      - name: Build and push Docker image
        working-directory: backend
        run: |
          docker build -t karsajobs:latest .
          docker tag karsajobs:latest ghcr.io/daffaverse/karsajobs:latest
          docker push ghcr.io/daffaverse/karsajobs:latest
