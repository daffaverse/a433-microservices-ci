# .github/workflows/backend.yml
name: Karsajobs Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-dockerfile:
    name: Lint Backend Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated version

      - name: Run Hadolint # Using Hadolint action
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

  test-app:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5 # Updated version
        with:
          go-version: '1.21' # Use a recent Go version (adjust if needed)

      - name: Run tests
        working-directory: backend
        run: go test -v -short --count=1 $(go list ./...)

  build-and-push-backend:
    name: Build and Push Backend Image
    needs: [lint-dockerfile, test-app] # Depends on successful linting and tests
    runs-on: ubuntu-latest
    permissions: # Explicitly define permissions needed
      contents: read
      packages: write # Needed for pushing to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3 # Updated version
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Use actor or github.repository_owner
          password: ${{ secrets.PAT_GITHUB }} # Ensure this PAT has write:packages scope

      - name: Build and push Docker image
        uses: docker/build-push-action@v5 # Use dedicated action for build and push
        with:
          context: ./backend # Path to the directory containing the Dockerfile
          file: ./backend/Dockerfile # Explicitly specify Dockerfile path
          push: true # Push the image after building
          tags: ghcr.io/${{ github.repository_owner }}/karsajobs:latest # Use dynamic owner and repo name
