# .github/workflows/frontend.yml
name: Karsajobs UI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-dockerfile:
    name: Lint Frontend Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated version

      - name: Run Hadolint # Using Hadolint action
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3007 # Example: Ignore specific rule if needed

  build-and-push-ui:
    name: Build and Push Frontend Image
    needs: [lint-dockerfile] # Depends on successful linting
    runs-on: ubuntu-latest
    permissions: # Explicitly define permissions needed
      contents: read
      packages: write # Needed for pushing to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3 # Updated version
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Use actor (user triggering the action) or github.repository_owner
          password: ${{ secrets.PAT_GITHUB }} # Ensure this PAT has write:packages scope

      - name: Build and push Docker image
        uses: docker/build-push-action@v5 # Use dedicated action for build and push
        with:
          context: ./frontend # Path to the directory containing the Dockerfile
          file: ./frontend/Dockerfile # Explicitly specify Dockerfile path
          push: true # Push the image after building
          tags: ghcr.io/${{ github.repository_owner }}/karsajobs-ui:latest # Use dynamic owner and repo name
